# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

# This is a read-only CI workflow; grant the GITHUB_TOKEN nothing more.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 19.x, 20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      # The repo uses an npm lockfile, so install/test with npm (was `yarn`).
      - run: npm ci
      - run: npm test

  # Reminds contributors to add a changeset when a PR changes the package.
  # Non-blocking: docs-only PRs legitimately have no changeset, so this is a
  # visible signal rather than a hard gate.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      # Non-blocking reminder: surface a warning annotation when a PR touches
      # the package but has no changeset, without failing the check (docs-only
      # and CI-only PRs legitimately have none).
      - name: Check for a changeset
        run: |
          npx changeset status --since=origin/master \
            || echo "::warning title=No changeset found::This PR changes the package but has no changeset. If it affects the published output, add one with 'npx changeset'. Docs-only or CI-only changes can ignore this."
