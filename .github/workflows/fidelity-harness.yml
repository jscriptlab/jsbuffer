name: Fidelity harness

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Tests require mismatches and unavailable metadata generation to fail.
      # This checks the harness, not the future release's TypeScript parity.
      - run: npm run test:fidelity
