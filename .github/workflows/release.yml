# Publishes jsbuffer to npm via Changesets.
#
# Flow:
#   * Contributors add a changeset to their PR (`npx changeset`).
#   * On every push to `master` (i.e. a merged PR) this workflow runs the
#     Changesets action, which either:
#       - opens/updates a "Version Packages" PR that bumps the version and
#         updates CHANGELOG.md by consuming the pending changesets, or
#       - publishes to npm (+ git tag + GitHub release) once that
#         "Version Packages" PR is itself merged.
#
# Required setup:
#   * Repo secret NPM_TOKEN: an npm "Automation" (or granular) access token.
#   * Settings > Actions > General > Workflow permissions:
#       "Allow GitHub Actions to create and approve pull requests" enabled.
#   * Repo secret RELEASE_PAT (see note below): needed so the "Version
#     Packages" PR triggers the required CI checks and can be merged.
#
# Why RELEASE_PAT is needed:
#   GitHub intentionally does NOT start new workflow runs for events created
#   with the built-in GITHUB_TOKEN (this prevents recursive CI loops). So when
#   Changesets opens/updates the "Version Packages" PR using GITHUB_TOKEN, the
#   `pull_request` workflows (test / lint / changeset) never run on it. Any
#   branch-protection "required check" (e.g. test (18.x), test (20.x), ...)
#   then stays pending forever as "Expected — waiting for status to be
#   reported", which blocks that PR from being merged even though nothing is
#   actually wrong.
#
#   Authoring the PR with a different identity makes those `pull_request`
#   workflows run normally, so the required checks report and pass. Use a
#   fine-grained Personal Access Token (contents: read/write, pull requests:
#   read/write) stored as RELEASE_PAT, or swap in a GitHub App token via
#   actions/create-github-app-token. If RELEASE_PAT is not set this workflow
#   falls back to GITHUB_TOKEN and still opens the PR — but the required
#   checks will not run on it until a non-GITHUB_TOKEN identity is configured.
name: Release

on:
  push:
    branches: ['master']

# Never run two releases for the same ref at once.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version-bump commit, git tags and GitHub release
  pull-requests: write # open/update the "Version Packages" PR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Changesets needs full history to diff against baseBranch
          # Push the version branch with the release identity (RELEASE_PAT when
          # configured) so the "Version Packages" PR triggers CI. Falls back to
          # the built-in token, whose pushes/PRs do not start workflow runs.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          version: npm run version # `changeset version`
          publish: npm run release # build + `changeset publish`
          commit: 'chore: release jsbuffer'
          title: 'chore: release jsbuffer'
        env:
          # Author the "Version Packages" PR with RELEASE_PAT (when configured)
          # so the required `pull_request` checks run on it; GITHUB_TOKEN-created
          # PRs never trigger CI and would leave those checks stuck pending.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          # setup-node's `registry-url` writes a temp .npmrc (via
          # NPM_CONFIG_USERCONFIG) that reads the token from NODE_AUTH_TOKEN and
          # takes precedence over ~/.npmrc, so the publish must expose the token
          # under that name. NPM_TOKEN is kept for changesets/action's own use.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
