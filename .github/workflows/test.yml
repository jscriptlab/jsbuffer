name: Test

on:
  push:
    branches:
      - 'master'
      - 'feature/**'
      - 'develop'
  pull_request:
    branches:
      - 'master'
      - 'develop'
      - 'feature/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Print GitHub Context
        run: |
          sudo apt install -y --install-recommends yajl-tools
          echo $GITHUB_VAR_JSON | json_reformat -m
        env:
          GITHUB_VAR_JSON: '${{ toJson(github) }}'
      - uses: actions/checkout@v4
      - run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        id: nvm
      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
      - name: Install OS dependencies
        run: |
          sudo apt install \
            -y --install-recommends \
              cmake gcc g++ gcc-avr simavr avr-libc \
              gcc-multilib g++-multilib clang
      - name: Print C/C++ compiler versions
        run: |
          clang --version
          clang++ --version
          gcc --version
          g++ --version
          avr-gcc --version
          avr-g++ --version
      - name: Install Node.js packages
        run: npm install
      - name: Build the project
        run: npm run build
      - name: Run tests
        run: npm run test

  notify:
    needs: test
    # PRs validate payloads offline. Delivery is optional and only runs for
    # repository pushes; it cannot change the required test job's conclusion.
    if: ${{ always() && !cancelled() && github.event_name == 'push' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    env:
      TEST_RESULT: ${{ needs.test.result }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -b scripts --force
      - name: Send Slack message about test results
        if: ${{ env.SLACK_BOT_TOKEN != '' && env.SLACK_SIGNING_SECRET != '' }}
        run: node scripts/notify.js --notification-type test-finished
        env:
          TRIGGERING_ACTOR: '${{ github.triggering_actor }}'
