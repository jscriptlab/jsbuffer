# Builds the source and runs the test suite across the supported Node.js
# versions, then reports test coverage.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Test

on:
  push:
    branches: ['master']
  # Run on every pull request, regardless of the target branch.
  pull_request:

# Least-privilege GITHUB_TOKEN: these jobs only need to read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verify generated 16-bit consumers
        env:
          TS_NODE_PROJECT: test/tsconfig.json
        run: |
          node -r ts-node/register <<'NODE'
          const suite = require('./test/FileGenerator.ts').default;
          const regression = suite.tests.get('it should compile and round-trip signed and unsigned 16-bit fields');
          if (!regression) throw new Error('Missing 16-bit regression');
          regression.run().then(() => console.log('16-bit compilation and 30 round trips passed')).catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - run: npm test

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run tests with coverage
        # Use bash so the pipe runs with `-o pipefail`; otherwise a failure in
        # `npm run test:coverage` would be masked by tee's successful exit.
        shell: bash
        run: npm run test:coverage | tee coverage.txt
      - name: Publish coverage report to the job summary
        if: always()
        run: |
          {
            echo '## Test coverage'
            echo ''
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
